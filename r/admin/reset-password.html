<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mala Cafe · ตั้งรหัสผ่านใหม่</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Kanit:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#150F0D;--card:#241A16;--text:#F4E9DC;--muted:#A9927F;--red:#C1321F;--gold:#C9A24B;--line:rgba(244,233,220,.12)}
*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{font-family:'Noto Sans Thai','Kanit',sans-serif;background:radial-gradient(ellipse 900px 500px at 15% -10%,rgba(193,50,31,.16),transparent 60%),var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:min(440px,100%);background:rgba(36,26,22,.96);border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:0 25px 90px rgba(0,0,0,.5)}
h1{font-size:24px;margin:0 0 7px}.sub{font-size:13px;color:var(--muted);margin:0 0 22px}label{display:block;font-size:12px;font-weight:700;margin:14px 0 7px}input{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:#1b120f;color:var(--text);font-size:15px;outline:none}button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:12px;background:linear-gradient(120deg,var(--red),var(--gold));color:#fff;font-weight:800;font-size:15px}button:disabled{opacity:.55}.msg{min-height:20px;margin-top:10px;color:#ff9b85;font-size:12px}.success{color:#9ee0a6}.hidden{display:none!important}.back{display:block;text-align:center;margin-top:16px;color:var(--gold);font-size:13px;text-decoration:none}.brand{text-align:center;font-weight:800;color:var(--gold);margin-bottom:22px}
</style>
</head>
<body>
<div class="card">
  <div class="brand">Mala Cafe · Admin</div>
  <h1>ตั้งรหัสผ่านใหม่</h1>
  <p class="sub">กำหนดรหัสผ่านใหม่สำหรับบัญชี Admin ของคุณ</p>
  <div id="loading">กำลังตรวจสอบลิงก์รีเซ็ต...</div>
  <form id="form" class="hidden">
    <label for="password">รหัสผ่านใหม่</label>
    <input id="password" type="password" minlength="6" autocomplete="new-password" required placeholder="อย่างน้อย 6 ตัวอักษร">
    <label for="confirm">ยืนยันรหัสผ่านใหม่</label>
    <input id="confirm" type="password" minlength="6" autocomplete="new-password" required placeholder="พิมพ์รหัสผ่านอีกครั้ง">
    <div class="msg" id="msg"></div>
    <button id="submit" type="submit">บันทึกรหัสผ่านใหม่</button>
  </form>
  <a class="back" href="../">← กลับหน้า Admin</a>
</div>
<script>
const SUPABASE_URL="https://zwhvtuumxstnxmmszjom.supabase.co";
const SUPABASE_KEY="sb_publishable_Iz5IE2BDx5aSOVp30hpWvQ_p4BLCVDC";
const ADMIN_URL="https://xbanan4x.github.io/r/admin/";
const client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const loading=document.getElementById('loading'),form=document.getElementById('form'),msg=document.getElementById('msg');
function ready(){loading.classList.add('hidden');form.classList.remove('hidden');}
async function check(){
  try{
    const {data:{session}}=await client.auth.getSession();
    if(session){ready();return;}
    setTimeout(async()=>{
      const {data:{session:s}}=await client.auth.getSession();
      if(s) ready(); else {loading.textContent='ลิงก์รีเซ็ตไม่ถูกต้องหรือหมดอายุ กรุณาขอลิงก์ใหม่จากหน้า Admin';}
    },700);
  }catch(e){loading.textContent='ไม่สามารถตรวจสอบลิงก์ได้ กรุณาขอลิงก์ใหม่';}
}
client.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'&&session) ready();});
check();
form.addEventListener('submit',async e=>{
  e.preventDefault();msg.textContent='';msg.className='msg';
  const p=document.getElementById('password').value,c=document.getElementById('confirm').value,btn=document.getElementById('submit');
  if(p!==c){msg.textContent='รหัสผ่านไม่ตรงกัน';return;}
  if(p.length<6){msg.textContent='รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร';return;}
  btn.disabled=true;btn.textContent='กำลังบันทึก...';
  const {error}=await client.auth.updateUser({password:p});
  if(error){msg.textContent=error.message||'เปลี่ยนรหัสผ่านไม่สำเร็จ';btn.disabled=false;btn.textContent='บันทึกรหัสผ่านใหม่';return;}
  msg.className='msg success';msg.textContent='เปลี่ยนรหัสผ่านสำเร็จ กำลังกลับหน้า Admin...';
  setTimeout(()=>{location.href=ADMIN_URL;},1200);
});
</script>
</body>
</html>
